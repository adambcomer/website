baseURL = 'https://adambcomer.com/'
languageCode = 'en-us'
# Lets Hugo fall back to the last git commit date for pages with no date in
# front matter, so every sitemap entry carries a <lastmod>.
enableGitInfo = true
title = 'Adam Comer'

disableKinds = ['taxonomy']

# Blog posts store their dates in `createDate`/`updateDate`, not Hugo's default
# `date`/`lastmod`. Mapping them here gives every page a real `<lastmod>` in
# sitemap.xml and sorts list pages newest-first.
[frontmatter]
date = ['createDate', 'date', 'publishDate']
lastmod = ['updateDate', 'lastmod', 'createDate', 'date', ':git']
publishDate = ['createDate', 'publishDate', 'date']

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'
[security]
[security.exec]
allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[markup]
[markup.highlight]
noClasses = true
style = 'catppuccin-mocha'
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
